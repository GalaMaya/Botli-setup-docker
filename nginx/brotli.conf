server {
    listen 80;
    server_name _ ;  # 🔁 Ganti dengan domain kamu

    root /usr/share/nginx/html/public;

    # =========================
    # 🔗 Proxy Game dari OSS (Public Bucket)
    # =========================
    location /slab/ {
        # Proxy ke OSS endpoint
        proxy_pass https://html-game-brotli.oss-ap-southeast-5.aliyuncs.com;
        
        # 📦 Proxy Headers
        proxy_http_version 1.1;
        proxy_set_header Host HOST.oss-ap-REGION.aliyuncs.com;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # ⏱️ Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # 🗄️ Buffering & Cache
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_cache_valid 200 1h;
        proxy_ignore_headers Set-Cookie;  # OSS tidak pakai cookie, aman di-ignore
        
        # 🔐 Godot/WebAssembly Headers (WAJIB agar tidak diblokir browser)
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        
        # 🛡️ Security headers (jangan lupa "always" agar tetap jalan untuk 4xx/5xx)
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy no-referrer-when-downgrade always;
    }

    # =========================
    # Game folder (local files)
    # =========================
    location /game-list/ {
        try_files $uri $uri/ =404;
        
        # 🔐 Tambah header juga untuk file lokal
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
    }

    # =========================
    # Enable Brotli (static pre-compressed)
    # =========================
    brotli off;              # CPU saver: no runtime compress
    brotli_static on;        # serve .br files if exist

    brotli_types
        text/plain
        text/css
        text/xml
        text/html
        application/javascript
        application/json
        application/wasm
        image/svg+xml;

    # =========================
    # Gzip fallback (browser lama)
    # =========================
    gzip on;
    gzip_static on;
    gzip_types *;

    # =========================
    # WASM MIME (WAJIB utk Godot/Unity)
    # =========================
    location ~* \.wasm$ {
        default_type application/wasm;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
    }

    # =========================
    # Cache asset game
    # =========================
    location ~* \.(js|wasm|data|json|br|pck)$ {
        expires 30d;
        add_header Cache-Control "public, immutable, no-transform";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }

    # =========================
    # Default: serve local files
    # =========================
    location / {
        try_files $uri $uri/ =404;
    }
}
