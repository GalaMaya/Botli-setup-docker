server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html/public;
    index index.html;

    # =========================
    # Static Compression (CPU Saver)
    # =========================
    brotli off;
    brotli_static on;
    brotli_types text/plain text/css text/xml text/html application/javascript application/json application/wasm image/svg+xml;

    gzip on;
    gzip_static on;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;

    # =========================
    # 🔑 FIX: Handle .br files explicitly
    # =========================
    location ~* \.br$ {
        # WAJIB: Beritahu browser ini file terkompresi Brotli
        add_header Content-Encoding br always;
        
        # Tipe MIME aman untuk Unity JS/WASM
        types { }
        default_type application/javascript;

        # Cache & Security & COOP/COEP (ulang karena Nginx tidak inherit)
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # =========================
    # WASM files
    # =========================
    location ~* \.wasm$ {
        default_type application/wasm;
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # =========================
    # Game folder: /slab/
    # =========================
    location /slab/ {
        try_files $uri $uri/ /slab/index.html =404;
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    location /game-list/ {
        try_files $uri $uri/ =404;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # =========================
    # Static assets lain (data, json, pck, mem)
    # =========================
    location ~* \.(data|json|pck|mem|symbols\.json)$ {
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}